name: Source format comparison

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-format-review.yml'
      - 'tools/source_format_review.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-format-review
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Science of Origin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install document extraction libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          python -m pip install --upgrade pip
          python -m pip install pypdf pymupdf python-docx striprtf pillow

      - name: Compare source formats
        run: python tools/source_format_review.py

      - name: Publish comparison reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/source-format-review
          git add library/coverage/chinese-compilation-pdf-text-comparison-2026-11-25.csv library/coverage/source-format-comparison-2026-11-25.md library/derived/chinese-image-page-ocr-2026-11-25.txt library/derived/chinese-image-page-ocr-2026-11-25.csv
          git commit -m "Publish Chinese and Entropy source format comparison"
          git push --force-with-lease origin automation/source-format-review

      - name: Upload detailed extraction and visual review aids
        uses: actions/upload-artifact@v4
        with:
          name: source-format-review
          path: source-review-artifacts/
          retention-days: 90
