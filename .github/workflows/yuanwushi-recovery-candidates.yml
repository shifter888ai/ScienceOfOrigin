name: Yuanwushi recovery candidate collection

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yuanwushi-recovery-candidates.yml'
      - 'tools/build_yuanwushi_recovery_candidates.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yuanwushi-recovery-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Science of Origin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned MDN interactive examples source
        uses: actions/checkout@v4
        with:
          repository: mdn/interactive-examples
          ref: 13024db581b08fae11a0ca229497198b9b0534e7
          path: mdn-interactive-examples

      - name: Build separate recovery-candidate layer
        run: python3 tools/build_yuanwushi_recovery_candidates.py

      - name: Publish candidate layer for review
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/yuanwushi-recovery-candidates
          git add materials/yuanwushi/recovery-candidates/
          git commit -m "Add alternate-source candidates for Yuanwushi 404 assets"
          git push --force-with-lease origin automation/yuanwushi-recovery-candidates
